name: mobitrail
description: MobiTrail Face Recognition Attendance System - A production-ready Flutter application for employee face attendance management.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking
  http: ^1.2.0

  # Location Geofencing
  geolocator: ^11.0.0

  # State Management
  provider: ^6.1.2

  # Camera Integration
  camera: ^0.11.0+2

  # Animations
  animate_do: ^3.3.4
  lottie: ^3.1.2

  # UI Utilities
  flutter_spinkit: ^5.2.1
  google_fonts: ^6.2.1

  # Permissions
  permission_handler: ^11.3.1

  # Storage (for mock persistence)
  shared_preferences: ^2.3.2

  # Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
